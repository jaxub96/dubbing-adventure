name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, python: "3.9"}
          - {os: macos-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - name: ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) command -v ffmpeg || brew install ffmpeg ;;
            Linux) sudo apt-get update && sudo apt-get install -y ffmpeg xvfb libportaudio2 ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
      - run: pip install -r requirements.txt
      - name: tkinter + sounddevice import (PortAudio bundled?)
        run: python -c "import tkinter, sounddevice; print(tkinter.TkVersion, sounddevice.__version__)"
      - name: tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -v
      - name: tests
        if: runner.os != 'Linux'
        run: python -m pytest -v
