[project]
name = "gdub"
version = "0.1.0"
description = "Line-ID-driven voice-over recording toolkit for Gothic dubbing projects"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12", "sounddevice>=0.4.6"]

[project.scripts]
gdub = "gdub.cli:main"

[tool.setuptools]
packages = ["gdub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
